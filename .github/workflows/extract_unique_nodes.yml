name: extract_unique_nodes

on:
  push:
    paths:
      - 'extract_unique_nodes.py'
      - '.github/workflows/extract_unique_nodes.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Run extraction script
        run: |
          python extract_unique_nodes.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "extract-bot"
          git config --global user.email "extract-bot@users.noreply.github.com"
          git add nodes_unique/
          git status
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-extract unique nodes [skip ci]"
            git push
          fi