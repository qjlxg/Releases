name: 节点测速与 AIO 生成
# 来源于https://github.com/wzmwayne/proxy-node
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/scrape.yml'
      - 'test_nodes.py'
      - 'generated/probe/cf_nest_1only_probe_01.yaml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Install mihomo core
        run: |
          ARCH=$([ "$(uname -m)" = "aarch64" ] && echo arm64 || echo amd64)
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.9/mihomo-linux-${ARCH}-v1.19.9.gz" -o mihomo.gz
          gunzip -f mihomo.gz
          chmod +x mihomo
          echo "MIHOMO_BIN=$PWD/mihomo" >> "$GITHUB_ENV"

      - name: Test nodes and build AIO
        run: |
          INPUT_FILE="generated/probe/cf_nest_1only_probe_01.yaml"
          if [ -f "$INPUT_FILE" ]; then
            python test_nodes.py "$INPUT_FILE" -o "filtered_nodes.yaml"
          else
            echo "::error::未找到指定的输入文件: $INPUT_FILE"
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "proxy-node-bot"
          git config user.email "bot@proxy-node.dev"
          git stash
          git pull --rebase || true
          git stash pop || true
          git add filtered_nodes.yaml
          git diff --cached --quiet || git commit -m "update: $(TZ=Asia/Shanghai date +%Y-%m-%d %H:%M) AIO 节点测速更新"
          git push
