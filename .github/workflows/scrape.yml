name: 节点测速与 AIO 生成

on:
  schedule:
    - cron: '0 */23 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/scrape.yml'
      - 'test_nodes.py'
      - 'generated/probe/*.yaml'
      - 'generated/batches/*.yaml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Install mihomo core
        run: |
          ARCH=$([ "$(uname -m)" = "aarch64" ] && echo arm64 || echo amd64)
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.9/mihomo-linux-${ARCH}-v1.19.9.gz" -o mihomo.gz
          gunzip -f mihomo.gz
          chmod +x mihomo
          echo "MIHOMO_BIN=$PWD/mihomo" >> "$GITHUB_ENV"

      - name: Test nodes and build AIO
        run: |
          # 直接把整个 probe 目录传给脚本，它会自动扫描里面所有的 yaml 文件并完成分批测速与保存
          python test_nodes.py "generated/probe/*.yaml" -o "filtered_nodes.yaml"

      - name: Commit and push
        run: |
          git config user.name "proxy-node-bot"
          git config user.email "bot@proxy-node.dev"
          git stash
          git pull --rebase || true
          git stash pop || true
          
          # 🔑 同时将最终结果、分批缓存目录以及白黑名单历史库纳入版本控制
          git add filtered_nodes.yaml generated/batches/ .valid_pool.json .invalid_pool.json
          
          git diff --cached --quiet || git commit -m "update: $(TZ=Asia/Shanghai date +%Y-%m-%d %H:%M) AIO 节点测速与双重黑白名单缓存更新"
          git push
