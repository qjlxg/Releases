- name: ♻️ 自动选择
  type: url-test
  proxies: *id001
  url: https://www.gstatic.com/generate_204
  interval: 300
  timeout: 5000
  expected-status: 200-299
  tolerance: 50
- name: 🔰 故障转移
  type: fallback
  proxies: *id001
  url: https://www.gstatic.com/generate_204
  interval: 300
  timeout: 5000
  expected-status: 200-299
- name: 🇨🇳 国内直连
  type: select
  proxies:
  - DIRECT
  - 🚀 节点选择
- name: 🌍 国外代理
  type: select
  proxies:
  - 🚀 节点选择
  - ♻️ 自动选择
  - 🔰 故障转移
  - DIRECT
rule-providers:
  ads:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs
    path: ./rules/ads.mrs
    interval: 86400
rules:
- RULE-SET,ads,REJECT
- DOMAIN-SUFFIX,cn,DIRECT
- GEOIP,CN,DIRECT
- MATCH,🌍 国外代理
