mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  fallback:
  - 1.1.1.1
  - 8.8.8.8
rule-providers:
  reject-ads:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
    path: ./rules/reject_ads.yaml
    interval: 86400
  china-list:
    type: http
    behavior: domain
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt
    path: ./rules/china_list.yaml
    interval: 86400
  china-ip:
    type: http
    behavior: ipcidr
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cnip.txt
    path: ./rules/china_ip.yaml
    interval: 86400
proxy-groups:
- name: 节点选择
  type: select
  proxies: &id001
  - '[OpenRay] 🇺🇸 US-27957'
- name: 自动选择
  type: url-test
  proxies: *id001
  url: https://www.gstatic.com/generate_204
  interval: 300
  timeout: 5000
- name: 去广告
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: 国内直连
  type: select
  proxies:
  - DIRECT
  - 节点选择
- name: 国外代理
  type: select
  proxies:
  - 节点选择
  - 自动选择
  - DIRECT
rules:
- RULE-SET,reject-ads,去广告
- RULE-SET,china-list,国内直连
- RULE-SET,china-ip,国内直连
- MATCH,国外代理
proxies:
  - name: '[OpenRay] 🇺🇸 US-27957'
    type: vless
    server: 154.17.228.81
    port: 59686
    uuid: 88ee0e1e-a2a2-477e-88ce-4875c058aeba
    client-fingerprint: chrome
    skip-cert-verify: true
    tls: true
    servername: 123.714541.xyz
    network: ws
    ws-opts:
      path: /Ra-vl
      headers:
        Host: 123.714541.xyz
